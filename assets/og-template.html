<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Plantilla de la imagen para compartir (og.jpg, 1200×630).
     Se renderiza con un navegador sin cabeza y se guarda en assets/img/og.jpg. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1200px; height:630px; overflow:hidden;
    font-family:'Manrope','Inter',system-ui,sans-serif;
    background:#F5F0E8; color:#1C1A18;
    display:grid; grid-template-columns:1fr 400px; align-items:center; gap:56px;
    padding:0 84px; position:relative;
  }
  body::after{
    content:''; position:absolute; inset:24px; border:1px solid rgba(28,26,24,0.16); border-radius:6px;
    pointer-events:none;
  }
  .eyebrow{font-size:17px; font-weight:700; letter-spacing:0.28em; color:#56634A; text-transform:uppercase; margin-bottom:26px;}
  h1{font-size:68px; line-height:1.05; font-weight:700; letter-spacing:-0.035em; margin-bottom:28px;}
  h1 span{display:block; color:#2F3F36;}
  p{font-size:24px; color:#57534C; line-height:1.4;}
  .seal{
    width:400px; height:400px; background:#1C1A18;
    -webkit-mask:url("img/logo-sello.webp") center/contain no-repeat;
            mask:url("img/logo-sello.webp") center/contain no-repeat;
  }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Estudio web · San Luis Potosí</div>
    <h1>Sitios web que traen <span>clientes reales</span></h1>
    <p>Rápidos, seguros y fáciles de encontrar en Google.</p>
  </div>
  <div class="seal"></div>
</body>
</html>
